cvm-version: 0.11.0
shim:
  upstream-container: vllm
  upstream-port: 8000
  paths:
  - /v1/chat/completions
  - /v1/completions
  - /v1/models
  - /health
  - /metrics
  dummy-attestation: false
  publish-attestation: false
  authenticated: false
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://ccs-public-api-0f44d76-687034466197.us-central1.run.app/
cvm-network:
  inbound-ports:
  - 443
cpus: 32
memory: 262144
gpus: 8
models:
- name: glm-5.3
  repo: zai-org/GLM-5.3@935644c05e76fc198714f4cca449fd8b970ff6d7
  mpk: 616363157c9fd0450987e57e883e4676c3ac892802f2f4a000eeb2e4fcf88c0d_755663785984_83391275-884b-5ae3-96ee-352c94c5486e
containers:
- name: vllm
  image: vllm/vllm-openai@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
  runtime: nvidia
  gpus: all
  ipc: private
  shm_size: 64g
  restart: always
  env:
  - VLLM_WORKER_MULTIPROC_METHOD
  - VLLM_LOGGING_LEVEL
  command:
  - --model=/tinfoil/mpk/mpk-616363157c9fd0450987e57e883e4676c3ac892802f2f4a000eeb2e4fcf88c0d
  - --served-model-name=zai-org/GLM-5.3
  - --tensor-parallel-size=8
  - --kv-cache-dtype=fp8
  - --speculative-config={"method":"mtp","num_speculative_tokens":5}
  - --tool-call-parser=glm47
  - --reasoning-parser=glm45
  - --enable-auto-tool-choice
  - --max-model-len=auto
  - --gpu-memory-utilization=0.92
  - --host=0.0.0.0
  - --port=8000
  healthcheck:
    test:
    - CMD
    - curl
    - -sf
    - http://localhost:8000/health
    interval: 30s
    timeout: 10s
    start_period: 90m
  tmpfs:
    /tmp: size=512m,mode=1777,exec
    /root: size=20g,mode=0700,exec
