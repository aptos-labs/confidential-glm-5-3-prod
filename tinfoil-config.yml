cvm-version: 0.11.0
shim:
  upstream-container: vllm
  upstream-port: 8000
  paths:
  - /v1/chat/completions
  - /v1/completions
  - /v1/models
  - /health
  - /metrics
  dummy-attestation: false
  publish-attestation: false
  authenticated: true
  authenticated-endpoints:
  - /v1/chat/completions
  - /v1/completions
  - /v1/models
  - /metrics
  tls-mode: cert-proxy
  tls-challenge: dns
  tls-own-san-domain: true
  control-plane: https://api.inference.aptoslabs.com/
  atc: http://10.0.2.2:8399
cvm-network:
  inbound-ports:
  - 443
cpus: 32
memory: 262144
gpus: 8
models:
- name: glm-5.3
  repo: zai-org/GLM-5.3@935644c05e76fc198714f4cca449fd8b970ff6d7
  mpk: 616363157c9fd0450987e57e883e4676c3ac892802f2f4a000eeb2e4fcf88c0d_755663785984_83391275-884b-5ae3-96ee-352c94c5486e
containers:
- name: vllm
  image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
  runtime: nvidia
  gpus: all
  ipc: private
  shm_size: 64g
  restart: always
  env:
  - VLLM_WORKER_MULTIPROC_METHOD
  - VLLM_LOGGING_LEVEL
  - VLLM_USE_V2_MODEL_RUNNER
  command:
  - --model=/tinfoil/mpk/mpk-616363157c9fd0450987e57e883e4676c3ac892802f2f4a000eeb2e4fcf88c0d
  - --served-model-name
  - glm-5.3
  - zai-org/GLM-5.3
  - --tensor-parallel-size=8
  - --kv-cache-dtype=fp8
  - --speculative-config={"method":"mtp","num_speculative_tokens":1}
  - --tool-call-parser=glm47
  - --reasoning-parser=glm45
  - --enable-auto-tool-choice
  - --max-model-len=262144
  - --enable-prefix-caching
  - --scheduling-policy=priority
  - --enable-prompt-tokens-details
  - --gpu-memory-utilization=0.92
  - --decode-context-parallel-size=8
  - --dcp-comm-backend=ag_rs
  - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY"}
  - --host=0.0.0.0
  - --port=8000
  healthcheck:
    test:
    - CMD
    - curl
    - -sf
    - http://localhost:8000/health
    interval: 30s
    timeout: 10s
    start_period: 90m
  tmpfs:
    /tmp: size=32g,mode=1777,exec
    /root: size=20g,mode=0700,exec
